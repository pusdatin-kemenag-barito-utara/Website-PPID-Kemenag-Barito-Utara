root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ppid-api.exe ./cmd/ppid-api"
  entrypoint = "./tmp/ppid-api.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = ["cmd", "internal"]
  exclude_dir = ["tmp", "vendor", "docs"]
  exclude_regex = ["_test\\.go$"]
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500

[log]
  time = true
  main_only = false
  add_timestamp = true

[misc]
  clean_on_rebuild = true

[screen]
  clear_on_rebuild = true