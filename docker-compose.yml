services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ppid-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV}
      POCKETBASE_URL: ${POCKETBASE_URL}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - ppid-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ppid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      API_UPSTREAM_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    networks:
      - ppid-network

networks:
  ppid-network:
    driver: bridge